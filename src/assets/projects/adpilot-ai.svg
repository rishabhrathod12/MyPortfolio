<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="260" fill="#3b82f6" opacity="0.07"/>

  <text x="64" y="104" fill="#22d3ee" font-size="20" letter-spacing="4" font-family="Consolas, monospace">AGENTIC AI · AMAZON PPC</text>
  <text x="64" y="176" fill="#ffffff" font-size="68" font-weight="700">AdPilot AI</text>
  <text x="64" y="222" fill="#cbd5e1" font-size="26">Multi-agent advertising intelligence</text>
  <rect x="64" y="244" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Supervisor -->
  <rect x="420" y="296" width="360" height="64" rx="14" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
  <text x="600" y="336" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Supervisor</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M600 360 V392"/>
    <path d="M150 392 H1050"/>
    <path d="M150 392 V420 M450 392 V420 M750 392 V420 M1050 392 V420"/>
  </g>

  <!-- Built specialists -->
  <g font-size="19" font-weight="600" text-anchor="middle" fill="#e2e8f0">
    <rect x="50" y="420" width="200" height="74" rx="12" fill="#0f2a2a" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="150" y="464">Campaign</text>
    <rect x="350" y="420" width="200" height="74" rx="12" fill="#0f2a2a" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="450" y="464">Keyword</text>
    <rect x="650" y="420" width="200" height="74" rx="12" fill="#0f2a2a" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="750" y="464">Forecast</text>
    <rect x="950" y="420" width="200" height="74" rx="12" fill="#0f2a2a" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="1050" y="464">Reporting</text>
  </g>

  <!-- Planned -->
  <g font-size="18" text-anchor="middle" fill="#94a3b8">
    <rect x="200" y="530" width="220" height="56" rx="12" fill="none" stroke="#64748b" stroke-dasharray="6 6"/>
    <text x="310" y="565">Bid optimization</text>
    <rect x="490" y="530" width="220" height="56" rx="12" fill="none" stroke="#64748b" stroke-dasharray="6 6"/>
    <text x="600" y="565">Budget allocation</text>
    <rect x="780" y="530" width="220" height="56" rx="12" fill="none" stroke="#64748b" stroke-dasharray="6 6"/>
    <text x="890" y="565">Human approval</text>
  </g>

  <!-- Legend -->
  <g font-size="16" fill="#cbd5e1">
    <rect x="64" y="624" width="18" height="18" rx="4" fill="#0f2a2a" stroke="#34d399"/>
    <text x="92" y="639">Built, on mock data</text>
    <rect x="270" y="624" width="18" height="18" rx="4" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="298" y="639">Planned</text>
  </g>
  <rect x="880" y="616" width="256" height="36" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="1008" y="640" fill="#e2e8f0" font-size="16" text-anchor="middle" font-family="Consolas, monospace">MOCK DATA · EXECUTION OFF</text>
</svg>
